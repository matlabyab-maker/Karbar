          base64 -d /tmp/project.b64 > /tmp/project.zip
          mkdir -p /tmp/bodycropper
          unzip -q /tmp/project.zip -d /tmp/bodycropper
          cd /tmp/bodycropper
          # The archive may contain a top-level project directory.
          if [ -d BodyCropperAndroid_Release ]; then
            shopt -s dotglob
            mv BodyCropperAndroid_Release/* .
            rmdir BodyCropperAndroid_Release
          elif [ -d BodyCropperAndroid ]; then
            shopt -s dotglob
            mv BodyCropperAndroid/* .
            rmdir BodyCropperAndroid
          fi
          find . -maxdepth 2 -type f | head -50

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: /tmp/bodycropper
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BodyCropper-debug
          path: /tmp/bodycropper/app/build/outputs/apk/debug/app-debug.apk
